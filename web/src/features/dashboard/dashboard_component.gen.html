<div class="dashboard" aria-label="Dashboard" role="region">
  <button class="dashboard__button" data-part="button" data-ddas-id="web:dashboard:dashboard:button" type="submit"></button>
  <input class="dashboard__input" data-part="input" data-ddas-id="web:dashboard:dashboard:input" tabindex="0" required placeholder="0" type="number" />
  <span class="dashboard__label" data-part="label" data-ddas-id="web:dashboard:dashboard:label"></span>
  <a class="dashboard__link" data-part="link" data-ddas-id="web:dashboard:dashboard:link" href="{{slot}}" target="_blank"></a>
  <slot name="header"></slot>
  <slot name="footer"></slot>
</div>

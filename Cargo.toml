[workspace]
resolver = "2"
members = [
    "crates/questforge-api",
    "crates/questforge-ci",
    "crates/questforge-config",
    "crates/questforge-toolchain",
    "crates/questforge-verify",
    "crates/questforge-doctor",
    "crates/questforge-init",
    "crates/questforge-mcp",
    "crates/questforge-ops",
    "apps/quest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sweengineeringlabs/questforge"
rust-version = "1.100.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
questforge-api       = { path = "crates/questforge-api" }
questforge-ci        = { path = "crates/questforge-ci" }
questforge-config    = { path = "crates/questforge-config" }
questforge-toolchain = { path = "crates/questforge-toolchain" }
questforge-verify    = { path = "crates/questforge-verify" }
questforge-doctor    = { path = "crates/questforge-doctor" }
questforge-init      = { path = "crates/questforge-init" }
questforge-mcp       = { path = "crates/questforge-mcp" }
questforge-ops       = { path = "crates/questforge-ops" }

clap       = { version = "4.5", features = ["derive"] }
hex        = "0.4"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2       = "0.10"
tempfile   = "3"
thiserror  = "2.0"
ureq       = "2.10"
zip        = { version = "2.2", default-features = false, features = ["deflate"] }
